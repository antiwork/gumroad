name: Prepare the CI runner for specs
description: >-
  What the test image adds, installed on the runner: system packages, Ruby, Node,
  services, the test database and the test assets.
inputs:
  dockerhub-username:
    required: true
  dockerhub-password:
    required: true
  save-caches:
    description: Save the asset caches this run built. One shard per run is enough.
    default: "false"
runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      uses: nick-fields/retry@v3
      with:
        timeout_seconds: 120
        max_attempts: 3
        retry_wait_seconds: 10
        command: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_PASSWORD: ${{ inputs.dockerhub-password }}
    # In the background, so the service image pulls and the MinIO health check
    # overlap with the setup steps below. "Prepare test database" waits for it.
    - name: Start services
      run: (docker compose up -d > /tmp/compose.log 2>&1; echo $? > /tmp/compose.status) &
      shell: bash
    # Saved by the typecheck job on main, so apt downloads nothing on a hit.
    - name: Restore the test packages
      uses: actions/cache/restore@v4
      with:
        path: ~/test-packages
        key: test-packages-v1-${{ runner.os }}-${{ hashFiles('bin/ci-test-packages') }}
    - name: Install system packages
      run: bin/ci-test-packages install ~/test-packages
      shell: bash
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - uses: actions/setup-node@v4
      with:
        node-version-file: package.json
        cache: npm
    # Shares lint_js's cache, which only main pushes save.
    - uses: actions/cache/restore@v4
      id: node_modules
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc', 'patches/**') }}
    - run: npm ci
      shell: bash
      if: steps.node_modules.outputs.cache-hit != 'true'
    # Saved by the typecheck job on main, or by shard 0 of an earlier push to
    # this branch.
    - name: Restore the test assets
      id: test_assets
      uses: actions/cache/restore@v4
      with:
        path: |
          public/vite-test
          tmp/cache/vite
          public/js/gumroad-bundle.js
          public/js/gumroad-embed-bundle.js
        key: >-
          runner-test-assets-v2-${{ runner.os }}-${{ hashFiles(
            'app/javascript/**', 'app/views/**',
            'config/routes.rb', 'config/routes/**', 'config/domain.rb',
            'config/application.rb', 'config/boot.rb', 'config/environment.rb',
            'config/environments/**', 'config/redis.rb',
            'lib/catch_bad_request_errors.rb', 'lib/utilities/global_config.rb',
            'config/initializers/js-routes.rb', 'config/vite.json', 'config/vite/**',
            'config/currencies.json', 'lib/json_schemas/**', 'lib/tasks/**', 'Rakefile',
            'public/**', 'vendor/assets/**', 'patches/**', 'scripts/build_pages_tailwind.mjs',
            'docker/base/**', 'docker/web/Dockerfile.test', '.github/workflows/tests.yml', 'bin/ci-test-asset-tasks',
            'package.json', 'package-lock.json', '.npmrc', 'tsconfig.json',
            'vite.config.ts', 'vite.config.widget.ts', 'postcss.config.js',
            'Gemfile.lock', '.ruby-version') }}
    # After the key above, as in the typecheck job.
    - name: Restore the pages CSS
      id: pages_tailwind
      uses: actions/cache/restore@v4
      with:
        path: |
          public/pages-tailwind.css
          public/pages-tailwind-manifest.json
          public/assets/pages
          app/javascript/stylesheets/pages_tailwind.generated.html
        key: >-
          runner-pages-tailwind-v1-${{ runner.os }}-${{ hashFiles(
            'scripts/build_pages_tailwind.mjs', 'app/javascript/stylesheets/pages_tailwind.css',
            'package.json', 'package-lock.json', 'patches/**', '.github/workflows/tests.yml', 'bin/ci-test-asset-tasks') }}
    - name: Prepare test database and assets
      shell: bash
      run: |
        for _ in $(seq 1 90); do [ -f /tmp/compose.status ] && break; sleep 2; done
        cat /tmp/compose.log
        [ "$(cat /tmp/compose.status 2>/dev/null)" = 0 ] || { echo "docker compose up did not finish"; exit 1; }
        # Over TCP: during its first start, MySQL answers on the socket before it
        # listens on the port.
        ready=false
        for _ in $(seq 1 60); do
          if docker compose exec -T db_test mysql --protocol=tcp -h127.0.0.1 -uroot -ppassword -e "SELECT 1" > /dev/null 2>&1 \
            && curl -fsS http://localhost:9200/_cluster/health > /dev/null 2>&1 \
            && curl -fsS http://localhost:9000/minio/health/ready > /dev/null 2>&1; then
            ready=true
            break
          fi
          sleep 2
        done
        [ "$ready" = true ] || { echo "MySQL, Elasticsearch or MinIO did not become ready"; exit 1; }
        # The same preparation the build job bakes into the test image (the
        # database, the Vite test build, the widget bundles and the pages CSS), in
        # one Rails boot as docker/web/compile_assets.sh does, building only what
        # the caches above lacked. npm ci already ran above.
        bundle exec rake js:export db:setup $(bin/ci-test-asset-tasks)
        # docker wait prints the exit code instead of returning it.
        copy_status=$(docker wait "$(docker compose ps -aq copyfixturefiles)")
        [ "$copy_status" = 0 ] || { docker compose logs copyfixturefiles; exit 1; }
      env:
        PAGES_RESTORED: ${{ steps.pages_tailwind.outputs.cache-hit }}
        VITE_RESTORED: ${{ steps.test_assets.outputs.cache-hit }}
    - uses: actions/cache/save@v4
      if: steps.pages_tailwind.outputs.cache-hit != 'true' && inputs.save-caches == 'true'
      with:
        path: |
          public/pages-tailwind.css
          public/pages-tailwind-manifest.json
          public/assets/pages
          app/javascript/stylesheets/pages_tailwind.generated.html
        key: ${{ steps.pages_tailwind.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: steps.test_assets.outputs.cache-hit != 'true' && inputs.save-caches == 'true'
      with:
        path: |
          public/vite-test
          tmp/cache/vite
          public/js/gumroad-bundle.js
          public/js/gumroad-embed-bundle.js
        key: ${{ steps.test_assets.outputs.cache-primary-key }}
