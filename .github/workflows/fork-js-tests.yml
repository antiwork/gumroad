name: Fork JS Tests

on:
  push:
    branches:
      - feat/save-shortcut-product-editor
  pull_request:

concurrency:
  group: fork-js-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  js_tests_fork:
    name: JS tests (fork-only)
    if: github.repository_owner != 'antiwork'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Print environment
        run: |
          node -v
          npm -v
          git rev-parse --short HEAD
      - name: Run JS tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --ci | tee js_tests_output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-tests-output
          path: js_tests_output.txt
