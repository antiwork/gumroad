name: Prebuild test image

# Builds the test image for branch pushes outside Tests, so ci/green does not wait
# for it. The tag hashes the tree, so main's build finds the image ready when the
# merged tree matches the branch's, which skips about four minutes of the deploy path.
on:
  push:
    branches:
      - "**"
      - "!main"
    tags-ignore:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A run-all-specs branch builds the image in Tests, where its full suite uses it.
  image_scope:
    name: Image scope
    runs-on: ubicloud-standard-2
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[].labels[].name] | join("\n")' || true)
          if echo "$LABELS" | grep -qx 'run-all-specs'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: image_scope
    if: needs.image_scope.outputs.build == 'true'
    uses: ./.github/workflows/build-test-image.yml
    secrets: inherit
