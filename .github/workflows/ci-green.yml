name: CI Green

# Reports a single required commit status ("ci/green") that native auto-merge
# can wait on. The Tests workflow runs the real suite on `push` events (and on
# `pull_request_target` for FORK PRs only — internal PR-target runs are noops).
# The main ruleset requires the ci/green status, and until it lands, a PR shows
# as pending. This closes the gap where auto-merge fired instantly because the
# internal PR check suite was all noop/skipped (see gumroad PR #5667).
#
# Why commit statuses and not a job inside tests.yml: skipped check runs SATISFY
# required checks, so any job name the internal-PR noop run also emits would be
# an instant-green loophole. A workflow_run-triggered reporter never attaches
# check runs to the PR head SHA — it only sets the status via the API, and only
# for runs that actually executed the suite.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    # Real suite runs only: push events, or pull_request_target from a FORK
    # (internal pull_request_target runs are noops and must not report).
    if: >-
      github.event.workflow_run.event == 'push' ||
      (github.event.workflow_run.event == 'pull_request_target' &&
       github.event.workflow_run.head_repository.full_name != github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ci/green is the only status the main ruleset requires, so this is the
      # single place green is granted -- and the only place a migration-version
      # check cannot be outrun by main moving. A run that passed against an
      # older main (or a re-run of failed shards) must not carry its stale
      # verdict past a collision that landed since.
      - name: Re-check migration versions against current main
        id: migrations
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          # Four verdicts, because "we did not check" must not read as "clean":
          #   no       clean against main
          #   yes      collision
          #   skipped  nothing to check, and nothing this step could grant green
          #   unknown  the check could not run -- publisher leaves ci/green unset
          # unknown is the safe stall, not a pass: ci/green is the only required
          # status, so publishing success for a head we never checked is what
          # lets a stale collision merge.
          COLLISION=unknown

          # A fork head is absent from this repo and unreachable by SHA, but the
          # PR's refs/pull/N/head does live here. Without this the step used to
          # skip the re-check for every fork PR -- and then grant green over the
          # failure the push:main guard had already written on that same SHA.
          fetch_head() {
            git cat-file -e "$SHA^{commit}" 2>/dev/null && return 0
            git fetch --no-tags --quiet origin "$SHA" 2>/dev/null && return 0
            local number
            number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
                       --jq '.[0].number' 2>/dev/null) || return 1
            case "$number" in "" | null) return 1 ;; esac
            git fetch --no-tags --quiet origin "refs/pull/${number}/head" 2>/dev/null || return 1
            git cat-file -e "$SHA^{commit}" 2>/dev/null
          }

          if [ ! -f bin/check-migration-versions ]; then
            # Pre-dates the checker: there is no rule to apply, not a check we
            # failed to run.
            echo "No checker on main; nothing to re-check."
            COLLISION=skipped
          elif ! fetch_head; then
            # No open PR points at this SHA, so no ci/green on it can gate a
            # merge. Granting green here is inert rather than unsafe.
            echo "Head $SHA is not in this repo and no PR points at it."
            COLLISION=skipped
          else
            ruby bin/check-migration-versions origin/main "$SHA"
            case "$?" in
              0) COLLISION=no ;;
              1) COLLISION=yes ;;
              *) echo "Checker could not run; ci/green stays pending." ;;
            esac
          fi

          echo "collision=$COLLISION" >> "$GITHUB_OUTPUT"

      - name: Set ci/green status on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COLLISION: ${{ steps.migrations.outputs.collision }}
        run: |
          if [ "$CONCLUSION" = "success" ] && [ "$COLLISION" = "yes" ]; then
            STATE=failure
            DESC="Migration version collides with main. Rebase and renumber."
          elif [ "$CONCLUSION" = "success" ] && [ "$COLLISION" = "unknown" ]; then
            # The suite passed but the migration re-check could not run. Green
            # here would be a guess on the one status the ruleset requires, and
            # it would also overwrite a failure the push:main guard may already
            # have written on this SHA. Stall instead: pending blocks the merge
            # and a re-run resolves it.
            echo "Migration verdict unknown; leaving ci/green pending."
            exit 0
          elif [ "$CONCLUSION" = "success" ]; then
            STATE=success
            DESC="Test suite passed"
          elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "timed_out" ] || [ "$CONCLUSION" = "action_required" ]; then
            STATE=failure
            DESC="Test suite: $CONCLUSION"
          else
            # cancelled, neutral, skipped — leave the status unset so the
            # required check stays pending instead of flipping to failure.
            # A concurrency-cancel is moot (the head has already moved to a
            # new SHA); a manual cancel on the current head should not require
            # a manual re-trigger to unblock auto-merge. (timed_out is treated
            # as a genuine failure above and is intentionally not covered here.)
            echo "Workflow conclusion is '$CONCLUSION'; not reporting ci/green."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context="ci/green" \
            -f description="$DESC" \
            -f target_url="$RUN_URL"
