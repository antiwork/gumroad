name: Rerun hung checkout

# Re-runs a `Tests` attempt when the only thing that went wrong was a timeout
# before the tests started: actions/checkout at its 5-minute limit, the test
# image pull timing out three times (Docker Hub), or a job that burned its own
# `timeout-minutes` budget. Those failures are unrelated to the commit and land
# on shards at random.
#
# The job timeout is the one that arrives as `cancelled` rather than `failure`,
# because GitHub cancels a job that exceeds its own budget. That shape is worth
# recovering unattended: ci-green.yml deliberately does not report on a
# cancelled run, so the PR's required `ci/green` is never published and its
# auto-merge waits forever with nothing else to unblock it.
#
# Scoped hard on purpose: the classifier refuses unless every red job on the
# triggering attempt is one of those timeouts or a sibling fail-fast cancelled
# behind one, so a spec failure is never re-run into a pass -- and a `cancelled`
# attempt is only re-run when a job-timeout annotation proves GitHub cancelled
# it, never when a human or a cancel-in-progress threw it away, and never when a
# newer push has already superseded the attempt.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  actions: write # rerun-failed-jobs; the default token cannot re-run without it
  checks: read # the timeout text lives in the job's check-run annotations
  contents: read
  pull-requests: read # is this attempt still the head of its PR

jobs:
  rerun:
    runs-on: ubuntu-latest
    # run_attempt < 2 is the cap: attempt 1 may be re-run, attempt 2 is where
    # this stops. A hang that survives one re-run is not a flake worth chasing
    # unattended.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt < 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            bin/classify-hung-checkout
          sparse-checkout-cone-mode: false

      # The attempt's own jobs, not the run's latest conclusion: a shard that
      # hung on attempt 1 reads as SUCCESS once attempt 2 passes, and this
      # workflow is triggered by that first attempt completing.
      - name: Classify the triggering attempt
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          # A re-run joins this PR's concurrency group, so re-running an attempt a
          # newer push has already superseded can cancel the run on the current
          # head -- and a cancelled run publishes no ci/green either.
          if [ -n "${PR_NUMBER}" ]; then
            current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha || true)
            if [ -n "$current" ] && [ "$current" != "${HEAD_SHA}" ]; then
              echo "skip: superseded by ${current:0:8}"
              echo "rerun=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # --paginate --jq emits one job object per line (gh forbids --slurp
          # together with --jq). jq -s rebuilds the jobs array the classifier
          # reads. Use the triggering attempt, not the run's latest jobs.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s '{jobs: .}' > jobs.json

          # Annotations only for the jobs that already look like the hang, so a
          # 40-shard run does not cost 40 extra API calls.
          echo '{}' > annotations.json
          for id in $(ruby bin/classify-hung-checkout --candidates jobs.json); do
            messages=$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${id}/annotations" \
                         --jq '[.[].message]') || messages='[]'
            jq --arg id "$id" --argjson messages "$messages" \
              '.[$id] = $messages' annotations.json > annotations.tmp
            mv annotations.tmp annotations.json
          done

          # The run conclusion rides along so the classifier applies the same
          # `failure`-only rule as the job `if` above.
          jq -s --arg conclusion "$CONCLUSION" \
            '{jobs: .[0].jobs, annotations: .[1], conclusion: $conclusion}' \
            jobs.json annotations.json > attempt.json
          set +e
          ruby bin/classify-hung-checkout attempt.json
          status=$?
          set -e
          case "$status" in
            0) echo "rerun=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "rerun=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Re-run the attempt
        if: steps.classify.outputs.rerun == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # `--failed` is only meaningful for a `failure` attempt: a cancelled job
          # is not a failed job, and the point of re-running a job-timeout
          # attempt is to give the run a conclusion of its own so ci-green.yml
          # publishes the required ci/green. Re-run that whole attempt instead.
          if [ "$CONCLUSION" = "cancelled" ]; then
            gh run rerun "$RUN_ID" -R "$GITHUB_REPOSITORY"
          else
            gh run rerun "$RUN_ID" --failed -R "$GITHUB_REPOSITORY"
          fi
