name: autofix.ci

on:
  pull_request:
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubicloud-standard-2
    env:
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: npm ci

      - uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.CONTRIBSYS_CREDENTIALS }}
        with:
          bundler-cache: true

      - run: npm run setup

      - name: Run TSC
        run: npx tsc

      - name: Run eslint
        run: npx eslint --fix --max-warnings 0

      - name: Run prettier
        run: npx prettier --write '**/*.{css,scss,md,json}'

      - run: bundle exec rubocop -a

      - name: Run SVGO
        run: npx svgo --multipass app/assets/**/*.svg

      - uses: autofix-ci/action@ff86a557419858bb967097bfc916833f5647fa8c
