name: Migration Version Guard

# Two PRs can each add db/migrate/<V>_*.rb for the same V. Git sees no conflict
# (different filenames, no shared lines) and each PR is green against the main it
# branched from, so nothing blocks either merge -- the second one breaks main for
# everyone at `rake db:prepare`. See PR #6716.
#
# tests.yml catches the collision while a PR's own run is in flight, and
# ci-green.yml re-checks at the moment green is granted. This covers the third
# window: a PR that already holds a green ci/green when main moves under it.
# Failing ci/green is what makes that visible, because ci/green is the context
# the main ruleset requires -- a status of its own would report the problem while
# auto-merge sailed past it.
#
# Only ever writes failure. A PR cleared here is not marked green; ci-green.yml
# grants that, and it re-runs this same check before it does.

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write
  pull-requests: read

concurrency:
  group: migration-version-guard
  cancel-in-progress: false

jobs:
  recheck_open_prs:
    name: Re-check open PRs against main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip when this push did not touch db/migrate
        id: touched
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Zero SHA (branch creation) or a commit this clone does not have:
          # fall back to checking, since we cannot prove nothing moved.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" -- db/migrate | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Push did not touch db/migrate; no open PR can have newly collided."
          fi

      - name: Fail ci/green on open PRs that now collide
        if: steps.touched.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Nothing to re-check without it, and `ruby <missing file>` exits 1 --
          # the collision code -- which would fail every open PR.
          if [ ! -f bin/check-migration-versions ]; then
            echo "No checker on main; nothing to re-check."
            exit 0
          fi

          # Read the PR list once, up front: `gh` calls inside the loop would
          # otherwise compete for the loop's stdin.
          gh api "repos/${REPO}/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | "\(.number) \(.head.sha)"' > open-prs.txt

          while read -r NUMBER HEAD_SHA; do
              # refs/pull/N/head covers forks too, and reads data rather than
              # running any of it -- the checker only ever lists filenames.
              git fetch --no-tags --quiet origin "refs/pull/${NUMBER}/head" || {
                echo "PR #${NUMBER}: head not fetchable; skipping."
                continue
              }

              # The canonical checker, not a second copy of its rules: it also
              # catches a migration numbered under main's new schema.rb version,
              # which a collision-only check would miss.
              #
              # Only exit 1 is a collision. Exit 2 means the checker could not
              # run, and writing failure on that would block a clean PR on a
              # transient git failure -- this is the only writer of ci/green
              # that can turn a green PR red, so it has to fail open.
              set +e
              OUTPUT=$(ruby bin/check-migration-versions "$MAIN_SHA" FETCH_HEAD 2>&1)
              STATUS=$?
              set -e

              if [ "$STATUS" -eq 0 ]; then
                continue
              fi

              if [ "$STATUS" -ne 1 ]; then
                echo "PR #${NUMBER}: checker exited ${STATUS}; verdict unknown, leaving ci/green alone."
                echo "$OUTPUT" | sed 's/^/  /'
                continue
              fi

              echo "PR #${NUMBER} (${HEAD_SHA}) no longer coexists with main:"
              echo "$OUTPUT" | sed 's/^/  /'

              gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
                -f state=failure \
                -f context="ci/green" \
                -f description="Migration version collides with main. Rebase and renumber." \
                -f target_url="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
                < /dev/null >/dev/null
          done < open-prs.txt
