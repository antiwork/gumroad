# https://docs.docker.com/compose/compose-file/

x-service-healthy: &service_healthy
  condition: service_healthy

services:
  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
      args:
        RUBY_VERSION: ${RUBY_VERSION}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      RAILS_ENV: development
      RACK_ENV: development
      NODE_ENV: development

      DATABASE_HOST: db
      DATABASE_NAME: gumroad_development
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: password
      SKIP_NATIVE_MYSQL_RECONNECT: "true"

      REDIS_HOST: redis:6379/0
      SIDEKIQ_REDIS_HOST: redis:6379/1
      RPUSH_REDIS_HOST: redis:6379/2
      RACK_ATTACK_REDIS_HOST: redis:6379/3
      REDIS_URL: redis://redis:6379/0
      ANYCABLE_REDIS_URL: redis://redis:6379/5

      MONGO_DATABASE_URL: mongo:27017
      MONGO_DATABASE_NAME: gumroad_log_development
      MONGO_DATABASE_USERNAME: ""
      MONGO_DATABASE_PASSWORD: ""

      ELASTICSEARCH_HOST: http://elasticsearch:9200
      MEMCACHE_SERVERS: memcached:11211

      ANYCABLE_HOST: 0.0.0.0
      SHAKAPACKER_DEV_SERVER_HOST: 0.0.0.0

      AWS_S3_ENDPOINT: https://minio.gumroad.dev
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_DELETER_ACCESS_KEY_ID: minioadmin
      S3_DELETER_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ..:/workspace
      - bundle:/bundle_path
      - node_modules:/workspace/node_modules
    depends_on:
      db: *service_healthy
      redis: *service_healthy
      mongo: *service_healthy
      elasticsearch: *service_healthy
      memcached: *service_healthy
      minio: *service_healthy
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  db:
    image: mysql:8.0.32
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=gumroad_development
      - MYSQL_ROOT_HOST=%
    command:
      - "mysqld"
      - "--default-authentication-plugin=mysql_native_password"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--character-set-server=utf8mb4"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.0.7
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mongo:
    image: mongo:3.6.16
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    command: "mongod --smallfiles"
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  elasticsearch:
    image: elasticsearch:7.9.3
    restart: unless-stopped
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
    volumes:
      - elasticsearch7data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  memcached:
    image: memcached:1.6.39-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\r\n' | nc -w 2 127.0.0.1 11211 | grep -q VERSION"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; for bucket in gumroad-dev gumroad-specs gumroad-invoices gumroad-dev-public-storage gumroad-reporting-dev; do
        if ! /usr/bin/mc ls myminio/$$bucket > /dev/null 2>&1; then
          echo \"Bucket $$bucket does not exist. Creating...\";
          /usr/bin/mc mb myminio/$$bucket;

          echo \"Setting public read policy for $$bucket\";
          /usr/bin/mc anonymous set public myminio/$$bucket;
        else
          echo \"Bucket $$bucket already exists.\";
        fi;
        echo \"Enabling versioning for $$bucket\";
        /usr/bin/mc version enable myminio/$$bucket;
      done; exit 0; "

  copyfixturefiles:
    image: minio/mc
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - ../spec/support/fixtures:/fixtures:ro
      - ./fixture-files-private.txt:/fixture-files-private.txt:ro
      - ./fixture-files-public.txt:/fixture-files-public.txt:ro
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin > /dev/null 2>&1; echo \"Copying private fixture files to MinIO bucket...\"; while IFS= read -r file || [ -n \"$$file\" ]; do
        [ -z \"$$file\" ] && continue;
        if [ -f \"/fixtures/$$file\" ]; then
          echo \"Copying '$$file' to gumroad-specs/specs/ (private)\";
          /usr/bin/mc cp \"/fixtures/$$file\" \"myminio/gumroad-specs/specs/$$file\" > /dev/null 2>&1;
        else
          echo \"Error: '$$file' not found in fixtures directory\";
          exit 1;
        fi;
      done < /fixture-files-private.txt; echo \"Copying public fixture files to MinIO bucket...\"; while IFS= read -r file || [ -n \"$$file\" ]; do
        [ -z \"$$file\" ] && continue;
        if [ -f \"/fixtures/$$file\" ]; then
          echo \"Copying '$$file' to gumroad-specs/specs/ (public)\";
          /usr/bin/mc cp \"/fixtures/$$file\" \"myminio/gumroad-specs/specs/$$file\" > /dev/null 2>&1;
          echo \"Setting public-read ACL for '$$file'\";
          /usr/bin/mc anonymous set download \"myminio/gumroad-specs/specs/$$file\" > /dev/null 2>&1;
        else
          echo \"Error: '$$file' not found in fixtures directory\";
          exit 1;
        fi;
      done < /fixture-files-public.txt; echo \"Fixture files copied successfully\"; exit 0; "

  nginx:
    image: nginx:1.23.3
    restart: unless-stopped
    depends_on:
      app: *service_healthy
    networks:
      default:
        aliases:
          - minio.gumroad.dev
    volumes:
      - ./local-nginx/gumroad_dev.conf:/etc/nginx/conf.d/default.conf:Z
      - ./local-nginx/helperai_dev.conf:/etc/nginx/conf.d/helperai_dev.conf:Z
      - ./local-nginx/certs:/etc/ssl/certs/:Z
    ports:
      - 80:80
      - 8081:8081
      - 443:443
      - 3035:3035
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.antiwork.helper.proxy: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  elasticsearch7data:
  mysql_data:
  redis_data:
  mongo_data:
  minio_data:
  bundle:
  node_modules:
