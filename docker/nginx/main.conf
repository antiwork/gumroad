# Becomes /etc/nginx/nginx.conf, replacing the base image's copy.
#
# `worker_connections` and `worker_rlimit_nofile` are main-context directives, and
# run_nginx.sh has consul-template render our app config into conf.d/default.conf, which
# nginx includes from inside `http`. So there is nowhere else these settings can live.
#
# Kept byte-for-byte identical to nginx:1.30.4-alpine's default apart from those two
# settings and the upstream_* fields in log_format, so a base image bump stays a short review:
#   docker run --rm nginx:<tag> cat /etc/nginx/nginx.conf

user  nginx;
worker_processes  auto;

# Containers start with a soft open-files limit of 1024, which caps each worker at ~500
# proxied requests (client + upstream fd each) long before worker_connections binds; past
# it nginx cannot even open 500.html. The hard limit is far higher, so nginx can raise it.
worker_rlimit_nofile  32768;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  8192;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The upstream_* fields are '-' when no upstream was contacted (static hit,
    # error before connect), comma-separated per try when nginx retried across
    # several servers, and colon-separated when an internal redirect hit another
    # upstream, so consumers must parse them as lists, not scalars.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'request_time=$request_time upstream_connect_time=$upstream_connect_time '
                      'upstream_header_time=$upstream_header_time upstream_response_time=$upstream_response_time '
                      'upstream_status=$upstream_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
