upstream app {
    server 172.17.0.1:3000;

    # Without a cache every proxied request opens and closes its own socket, so the
    # TIME_WAIT count on :3000 tracks the request rate. Expire below Puma's 20s
    # persistent_timeout so nginx never sends on a socket Puma is already closing.
    keepalive 32;
    keepalive_timeout 15s;
}

server {
    listen {{ env "NOMAD_PORT_http" }};
    server_name www.gumroad.com;
    server_tokens        off;
    rewrite ^(.*) https://gumroad.com$1 permanent;
    add_header Strict-Transport-Security "max-age=31536000";
}

server {
    listen {{ env "NOMAD_PORT_http" }};
    server_name www.staging.gumroad.com;
    server_tokens        off;
    rewrite ^(.*) https://staging.gumroad.com$1 permanent;
    add_header Strict-Transport-Security "max-age=31536000";
}

server {
    # nginx defaults the backlog to 511. A load balancer's pool to a single host can grow
    # by orders of magnitude within seconds of a traffic shift, and somaxconn is 4096.
    listen {{ env "NOMAD_PORT_http" }} default_server backlog=4096;

    root /public;

    try_files $uri/index.html $uri @app;

    client_max_body_size 10M;

    # ALB liveness probe, answered here so it can never queue behind Puma: via
    # @app, app-tier latency times out the probe and ejects slow-but-alive hosts.
    # Liveness only -- app health is /healthcheck through the proxy, which deploy
    # readiness gates on. Don't merge the two checks back together.
    location = /healthcheck.txt {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Nonexistent first candidate forces the fallback to @app instead of the
    # real /public/favicon.ico that $uri would otherwise resolve to, so the
    # app can serve a per-seller icon on subdomains/custom domains.
    location = /favicon.ico {
        try_files /nonexistent @app;
    }

    # production static-2 URLs
    location ~ ^/res/(?<bucket>gumroad)/(assets|files|profiles)/ {
        resolver         10.1.0.2 valid=300s;
        resolver_timeout 10s;

        rewrite                ^/res/[a-z\-_]+/(.*)  /$1 break;
        proxy_intercept_errors on;
        proxy_pass             https://$bucket.s3.amazonaws.com;
        add_header Strict-Transport-Security "max-age=31536000";
        break;
    }

    # staging static-2 URLs
    location ~ ^/res/(?<bucket>gumroad-staging|gumroad_dev)/(assets|files|profiles)/ {
        resolver         10.0.0.2 valid=300s;
        resolver_timeout 10s;

        rewrite                ^/res/[a-z\-_]+/(.*)  /$1 break;
        proxy_intercept_errors on;
        proxy_pass             https://$bucket.s3.amazonaws.com;
        add_header Strict-Transport-Security "max-age=31536000";
        break;
    }

    # app URLs
    location @app {
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        # The default upstream protocol is HTTP/1.0, which has no chunked
        # framing: a streamed response becomes close-delimited, and any
        # early close then reads as a clean, complete body (Gumhead's SSE
        # truncated silently this way). HTTP/1.1 alone restores chunked
        # framing. The blank Connection header is what lets the upstream
        # keepalive cache reuse a socket -- without it nginx forwards the
        # client's Connection and closes after every response.
        proxy_http_version      1.1;
        proxy_set_header        Connection "";

        keepalive_timeout       75;
        proxy_read_timeout      120;

        proxy_buffers           16 64k;
        proxy_buffer_size       64k;
        client_body_buffer_size 128k;
    }

    error_page 500 502 503 504 /500.html;
}
