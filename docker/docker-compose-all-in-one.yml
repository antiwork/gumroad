# https://docs.docker.com/compose/compose-file/

services:
  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    env_file:
      - ../.env
    environment:
      RAILS_ENV: development
      RACK_ENV: development
      NODE_ENV: development

      DATABASE_HOST: db
      DATABASE_NAME: gumroad_development
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: password
      SKIP_NATIVE_MYSQL_RECONNECT: "true"

      REDIS_HOST: redis:6379/0
      SIDEKIQ_REDIS_HOST: redis:6379/1
      RPUSH_REDIS_HOST: redis:6379/2
      RACK_ATTACK_REDIS_HOST: redis:6379/3
      REDIS_URL: redis://redis:6379/0
      ANYCABLE_REDIS_URL: redis://redis:6379/5

      MONGO_DATABASE_URL: mongo:27017
      MONGO_DATABASE_NAME: gumroad_log_development
      MONGO_DATABASE_USERNAME: ""
      MONGO_DATABASE_PASSWORD: ""

      ELASTICSEARCH_HOST: http://elasticsearch:9200
      MEMCACHE_SERVERS: memcached:11211

      ANYCABLE_HOST: 0.0.0.0
      SHAKAPACKER_DEV_SERVER_HOST: 0.0.0.0
    volumes:
      - ..:/workspace
      - bundle:/bundle_path
      - node_modules:/workspace/node_modules
    depends_on:
      - db
      - redis
      - mongo
      - elasticsearch
      - memcached
    tty: true
    stdin_open: true

  db:
    image: mysql:8.0.32
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=gumroad_development
      - MYSQL_ROOT_HOST=%
    command:
      - "mysqld"
      - "--default-authentication-plugin=mysql_native_password"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--character-set-server=utf8mb4"

  redis:
    image: redis:7.0.7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:3.6.16
    volumes:
      - mongo_data:/data/db
    command: "mongod --smallfiles"

  elasticsearch:
    image: elasticsearch:7.9.3
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
    volumes:
      - elasticsearch7data:/data

  memcached:
    image: memcached:1.6.39

  nginx:
    image: nginx:1.23.3
    depends_on:
      - app
    volumes:
      - ./local-nginx/gumroad_dev_all_in_one.conf:/etc/nginx/conf.d/default.conf:Z
      - nginx_certs:/etc/ssl/certs/:Z
    ports:
      - 80:80
      - 8081:8081
      - 443:443
      - 3035:3035

volumes:
  elasticsearch7data:
  mysql_data:
  redis_data:
  mongo_data:
  nginx_certs:
  bundle:
  node_modules: