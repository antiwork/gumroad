x-app-common: &app-common
  image: gumroad-app:latest
  volumes:
    - ..:/workspace
    - bundle_path:/usr/local/bundle
    - node_modules:/workspace/node_modules
    - /workspace/bin/dist # Mask host's bin/dist - container downloads its own platform-specific binary
    - ~/.local/share/mkcert:/root/.local/share/mkcert:ro # Mount mkcert CA for SSL trust (Linux)
    - ~/Library/Application Support/mkcert:/root/mkcert-macos:ro # Mount mkcert CA for SSL trust (macOS)
  env_file:
    - ../.env
  # Override only Docker networking values - everything else comes from .env
  environment: &app-env
    DATABASE_HOST: db
    REDIS_HOST: redis:6379/0
    SIDEKIQ_REDIS_HOST: redis:6379/1
    RPUSH_REDIS_HOST: redis:6379/2
    RACK_ATTACK_REDIS_HOST: redis:6379/3
    MONGO_DATABASE_URL: mongo:27017
    ELASTICSEARCH_HOST: http://elasticsearch:9200
    AWS_S3_ENDPOINT: http://minio:9000
    SHAKAPACKER_DEV_SERVER_HOST: webpack

services:
  # Infrastructure services
  db:
    image: mysql:8.0.32
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
    command:
      - "mysqld"
      - "--default-authentication-plugin=mysql_native_password"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--character-set-server=utf8mb4"

  redis:
    image: redis:7.0.7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:3.6.16
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: "mongod --smallfiles"

  elasticsearch:
    image: elasticsearch:7.9.3
    ports:
      - "9200:9200"
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
    volumes:
      - elasticsearch7data:/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; for bucket in gumroad-dev gumroad-specs gumroad-invoices gumroad-dev-public-storage; do
        if ! /usr/bin/mc ls myminio/$$bucket > /dev/null 2>&1; then
          echo \"Bucket $$bucket does not exist. Creating...\";
          /usr/bin/mc mb myminio/$$bucket;

          echo \"Setting public read policy for $$bucket\";
          /usr/bin/mc anonymous set public myminio/$$bucket;
        else
          echo \"Bucket $$bucket already exists.\";
        fi;
        echo \"Enabling versioning for $$bucket\";
        /usr/bin/mc version enable myminio/$$bucket;
      done; exit 0; "

  copyfixturefiles:
    image: minio/mc
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - ../spec/support/fixtures:/fixtures:ro
      - ./fixture-files-private.txt:/fixture-files-private.txt:ro
      - ./fixture-files-public.txt:/fixture-files-public.txt:ro
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin > /dev/null 2>&1; echo \"Copying private fixture files to MinIO bucket...\"; while IFS= read -r file || [ -n \"$$file\" ]; do
        [ -z \"$$file\" ] && continue;
        if [ -f \"/fixtures/$$file\" ]; then
          echo \"Copying '$$file' to gumroad-specs/specs/ (private)\";
          /usr/bin/mc cp \"/fixtures/$$file\" \"myminio/gumroad-specs/specs/$$file\" > /dev/null 2>&1;
        else
          echo \"Error: '$$file' not found in fixtures directory\";
          exit 1;
        fi;
      done < /fixture-files-private.txt; echo \"Copying public fixture files to MinIO bucket...\"; while IFS= read -r file || [ -n \"$$file\" ]; do
        [ -z \"$$file\" ] && continue;
        if [ -f \"/fixtures/$$file\" ]; then
          echo \"Copying '$$file' to gumroad-specs/specs/ (public)\";
          /usr/bin/mc cp \"/fixtures/$$file\" \"myminio/gumroad-specs/specs/$$file\" > /dev/null 2>&1;
          echo \"Setting public-read ACL for '$$file'\";
          /usr/bin/mc anonymous set download \"myminio/gumroad-specs/specs/$$file\" > /dev/null 2>&1;
        else
          echo \"Error: '$$file' not found in fixtures directory\";
          exit 1;
        fi;
      done < /fixture-files-public.txt; echo \"Fixture files copied successfully\"; exit 0; "

  # This service is used to run one-time setup tasks
  init:
    <<: *app-common
    restart: "no"
    command: >
      sh -c "
        echo '=== Docker Init ===' &&

        mkdir -p tmp/pids &&

        if [ ! -f tmp/combined_ca_certs.pem ]; then
          echo 'Creating SSL cert file...' &&
          default_cert='/etc/ssl/certs/ca-certificates.crt' &&
          if [ ! -f \"$$default_cert\" ]; then
            default_cert=$$(ruby -ropenssl -e 'puts OpenSSL::X509::DEFAULT_CERT_FILE')
          fi &&
          mkcert_ca='' &&
          if [ -f '/root/.local/share/mkcert/rootCA.pem' ]; then
            mkcert_ca='/root/.local/share/mkcert/rootCA.pem' &&
            echo 'Found mkcert CA at Linux path'
          elif [ -f '/root/mkcert-macos/rootCA.pem' ]; then
            mkcert_ca='/root/mkcert-macos/rootCA.pem' &&
            echo 'Found mkcert CA at macOS path'
          fi &&
          if [ -f \"$$default_cert\" ] && [ -n \"$$mkcert_ca\" ]; then
            cat \"$$default_cert\" \"$$mkcert_ca\" > tmp/combined_ca_certs.pem &&
            cp \"$$mkcert_ca\" tmp/mkcert_ca.pem &&
            echo 'SSL cert files created'
          else
            echo 'ERROR: Could not create SSL cert file.' &&
            echo 'Make sure mkcert is installed and run: mkcert -install' &&
            echo 'Expected mkcert CA at ~/.local/share/mkcert (Linux) or ~/Library/Application Support/mkcert (macOS)' &&
            exit 1
          fi
        else
          echo 'SSL cert file already exists'
        fi &&

        if [ ! -f tmp/.docker_initialized ]; then
          echo 'First run - waiting for database...' &&
          until bin/rails runner \"ActiveRecord::Base.connection.execute('SELECT 1')\" 2>/dev/null; do
            echo 'Waiting for database...' &&
            sleep 2
          done &&
          echo 'Running db:prepare...' &&
          bin/rails db:prepare &&
          echo 'Reindexing Elasticsearch...' &&
          bin/rails runner 'DevTools.delete_all_indices_and_reindex_all' || echo 'Warning: reindex failed' &&
          touch tmp/.docker_initialized &&
          echo 'First-time setup complete!'
        else
          echo 'Already initialized, skipping setup'
        fi &&

        echo '=== Init Complete ==='
      "
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      mongo:
        condition: service_started
      elasticsearch:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully

  # Application services
  web:
    <<: *app-common
    command: ./bin/rails s -b 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    depends_on:
      init:
        condition: service_completed_successfully

  webpack:
    <<: *app-common
    command: sh -c "npm run setup && ./bin/shakapacker-dev-server"
    ports:
      - "3035:3035"
    environment:
      <<: *app-env
      SHAKAPACKER_DEV_SERVER_HOST: 0.0.0.0
    depends_on:
      init:
        condition: service_completed_successfully

  webpack-ssr:
    <<: *app-common
    command: ./bin/shakapacker --watch
    environment:
      <<: *app-env
      WEBPACK_SSR: "true"
    depends_on:
      init:
        condition: service_completed_successfully

  sidekiq:
    <<: *app-common
    command: bundle exec sidekiq -q critical -q default -q low -q mongo
    environment:
      <<: *app-env
      RAILS_MAX_THREADS: 5
      USE_DB_WORKER_REPLICAS: "true"
    depends_on:
      init:
        condition: service_completed_successfully

  anycable_rpc:
    <<: *app-common
    command: bundle exec anycable
    ports:
      - "50051:50051"
    environment:
      <<: *app-env
      ANYCABLE_RPC_HOST: 0.0.0.0:50051
      ANYCABLE_SECRET: anycable-local-secret
      ANYCABLE_REDIS_URL: redis://redis:6379/0
    depends_on:
      init:
        condition: service_completed_successfully

  anycable_ws:
    <<: *app-common
    command: bin/anycable-go
    ports:
      - "8080:8080"
    environment:
      ANYCABLE_HOST: 0.0.0.0
      ANYCABLE_PORT: 8080
      ANYCABLE_RPC_HOST: anycable_rpc:50051
      ANYCABLE_SECRET: anycable-local-secret
      ANYCABLE_BROADCAST_ADAPTER: http,redisx
      ANYCABLE_PUBSUB: redis
      ANYCABLE_REDIS_URL: redis://redis:6379/0
      ANYCABLE_BROKER: memory
      ANYCABLE_METRICS_PORT: 8080
      ANYCABLE_LOG_LEVEL: debug
      ANYCABLE_DEBUG: "true"
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.23.3
    volumes:
      - ./local-nginx/gumroad_dev_docker.conf:/etc/nginx/conf.d/default.conf:Z
      - ./local-nginx/helperai_dev.conf:/etc/nginx/conf.d/helperai_dev.conf:Z
      - ./local-nginx/certs:/etc/ssl/certs/:Z
    ports:
      - 80:80
      - 8081:8081
      - 443:443
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.antiwork.helper.proxy: "true"
    depends_on:
      web:
        condition: service_started
      anycable_ws:
        condition: service_started

volumes:
  elasticsearch7data:
  mysql_data:
  redis_data:
  mongo_data:
  minio_data:
  bundle_path:
  node_modules:
