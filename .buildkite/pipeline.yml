steps:
  - label: ":mag: Preview gate"
    key: preview-gate
    branches: "!main !comp-assets-*"
    command: ".buildkite/scripts/preview_gate.sh"

  - label: ":docker: Build Base Image"
    key: build-base-image
    branches: "main comp-assets-*"
    command: ".buildkite/scripts/build_base.sh"
    timeout_in_minutes: 60
    plugins:
      - docker-login#v3.0.0:
          username: gumroadteam
          password-env: DOCKERHUB_PASSWORD

  - label: ":docker: Build Web Image"
    key: build-web-image
    branches: "main comp-assets-*"
    command: ".buildkite/scripts/build_web.sh"
    depends_on: build-base-image
    timeout_in_minutes: 25
    plugins:
      - docker-login#v3.0.0:
          username: gumroadteam
          password-env: DOCKERHUB_PASSWORD

  - label: ":gear: Compile Assets"
    key: compile-assets
    branches: "main comp-assets-*"
    depends_on: build-web-image
    command: ".buildkite/scripts/compile_assets.sh"
    artifact_paths: "log/**/*"
    parallelism: 2
    timeout_in_minutes: 25
    plugins:
      - docker-login#v3.0.0:
          username: "gumroadteam"
          password-env: DOCKERHUB_PASSWORD
      - docker-login#v3.0.0:
          server: quay.io
          username: gumroad
          password-env: QUAY_PASSWORD

  - block: "Approval required for production deployment"
    key: require-approval
    branches: "main"
    prompt: "Are you sure you want to proceed with the deployment?"
    blocked_state: running

  - label: ":rocket: Deploy to Production"
    key: production-deployment
    depends_on:
      - compile-assets
      - require-approval
    branches: "main"
    command: ".buildkite/scripts/deploy_production.sh"
    # Must exceed the script's OWN waits plus a deploy, or the script can never reach its
    # own decision. deploy_production.sh waits up to 45 min on the payout healthcheck and
    # up to 120 min on the long-running-job one before it gives up and skips; a deploy then
    # takes ~23 min more. At 120 the long-running wait alone consumed the whole step, so a
    # deploy that waited it out was killed as `timed_out` (exit 255) instead of exiting 0 on
    # the skip path — turning a designed "let the report finish, ship on the next push" into
    # a red main. 240 leaves ~50 min of headroom over the 190-min worst case.
    timeout_in_minutes: 240
    # Serialize production deploys. A deploy holds a Consul lock for its whole run
    # (median 23 minutes), and deploy_production.sh exits 1 immediately if the lock is
    # already held. Without this, two commits merged inside one deploy window race: the
    # second starts, finds the lock, and dies ~30 seconds in. Failed deploys are not
    # retried, so main silently stops shipping until someone notices and pushes again.
    #
    # On 2026-07-25, 11 of 30 main deploy jobs failed — a 37% failure rate — and 9 of the
    # 11 were provably lost races (each started inside a concurrently-successful deploy's
    # hold window and died in 25-32s). The other two failed for unrelated reasons.
    #
    # concurrency_group makes Buildkite queue these steps instead: the second deploy
    # waits for the first to finish and then runs, which is what the Consul lock was
    # trying to express but could only enforce by failing.
    #
    # Scope: this serializes deploys started from THIS step only. A lock held by anything
    # else — a manual nomad/production/lock_deployment.sh run, or one leaked by a deploy
    # that died mid-flight — still fails a queued deploy exactly as it does today. That
    # residual case is what antiwork/gumroad-deployment#43 addresses, by recording who
    # holds the lock and why, and auto-releasing it when a deploy dies.
    concurrency_group: "gumroad/production-deploy"
    concurrency: 1
    # Left on the default concurrency_method ("ordered"): queued deploys run in the order
    # they were queued. That matters here — deploys ship a specific revision, so running
    # them out of order could put an older revision live after a newer one. "eager" only
    # removes the ordering guarantee; it does not mean newest-first.
    plugins:
      - docker-login#v3.0.0:
          username: "gumroadteam"
          password-env: DOCKERHUB_PASSWORD

  # Shadow mode for a main asset cache: compares, never ships. Last on purpose:
  # a block step waits for every step above it, so placed before the approval
  # gate this would hold every deploy. The explicit depends_on lets it start as
  # soon as the compile ends, without waiting for the gate.
  - label: ":mag: Asset cache shadow"
    key: asset-cache-shadow
    branches: "main"
    depends_on: compile-assets
    command: ".buildkite/scripts/main_asset_cache_shadow.sh"
    soft_fail: true
    timeout_in_minutes: 15

  # Boots the deploy's extra web capacity while the assets compile, so the deploy's
  # scale_up finds it ready. Never pins, never lowers, never fails the build. Below
  # the approval block, like the asset cache shadow, so the deploy never waits for it.
  - label: ":arrow_up: Pre-scale web clusters"
    key: prescale-web-clusters
    branches: "main"
    depends_on: build-web-image
    command: ".buildkite/scripts/prescale_web_clusters.sh"
    # soft_fail does not cover a timeout. The script stops itself after 240 s; the rest
    # is room for checkout and the pre-command hook's Docker prune and ECR login.
    timeout_in_minutes: 15
    soft_fail: true
