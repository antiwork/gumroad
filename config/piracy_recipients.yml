# Verified takedown contacts, keyed by host. An entry covers its subdomains, so "google.com"
# also covers drive.google.com. Add an entry only after checking the contact against the
# Copyright Office directory (https://dmca.copyright.gov/osp/) or the site's own DMCA page,
# and record that page as source_url.
#
# Every entry below was read from the Copyright Office directory on 2026-10-07. `name` is the
# service provider as the directory lists it, with its punctuation and its "(f/k/a ...)" history
# normalized. `email` is the designated agent the directory records. `source_url` is the record
# the entry was read from, so the next reader can re-check it.
#
# example.net:
#   name: Example Net Inc.
#   email: copyright@example.net
#   source_url: https://dmca.copyright.gov/osp/...

# Test fixture for the piracy screening agent. Remove when the end-to-end test is done.
piracy-test-antiwork.vercel.app:
  name: Antiwork piracy screening test
  email: gianfranco@gumroad.com
  source_url: https://piracy-test-antiwork.vercel.app/dmca

# Google's one designation covers Drive, Sites and Blogger, so a shared file, a published site
# and a blog all reach the same agent. Blogger is the reason for the second key: it lives on
# blogspot.com, which is not under google.com.
google.com:
  name: Google LLC
  email: dmca-agent@google.com
  source_url: https://dmca.copyright.gov/dmca/publish/history.html?search=Google+LLC&id=18b733849581703204a3229ddd03c10b
blogspot.com:
  name: Google LLC
  email: dmca-agent@google.com
  source_url: https://dmca.copyright.gov/dmca/publish/history.html?search=Google+LLC&id=18b733849581703204a3229ddd03c10b

