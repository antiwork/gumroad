default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  database: <%= ENV.fetch("DATABASE_NAME") %>
  host: <%= ENV.fetch("DATABASE_HOST") %>
  port: <%= ENV.fetch("DATABASE_PORT") %>
  # Keep the pool size above the Sidekiq concurrency so jobs don't run out of Active Record connections.
  # Sidekiq sets ENV["DB_POOL_SIZE"] to its concurrency. Web Puma does not, and
  # ActionController::Live plus publish-time AI threads checkout extra connections
  # beyond RAILS_MAX_THREADS (gp#2383). Production/staging never drop below 10,
  # even when RAILS_MAX_THREADS is set to Puma's thread count. Tests and
  # development keep the requested size, or 5.
  # See https://github.com/gumroad/infrastructure/issues/479 for more details.
  <% requested_pool = (ENV["DB_POOL_SIZE"].presence || ENV["RAILS_MAX_THREADS"].presence)&.to_i %>
  <% web_pool_floor = %w[production staging].include?(ENV.fetch("RAILS_ENV", "development")) ? 10 : nil %>
  pool: <%= web_pool_floor ? [requested_pool, web_pool_floor].compact.max : (requested_pool || 5) %>
  <%= "reconnect: true" unless ENV["SKIP_NATIVE_MYSQL_RECONNECT"] == "true" %>
  socket: <%= [
  '/var/run/mysqld/mysqld.sock',
  '/var/lib/mysql/mysql.sock',
  '/tmp/mysqld.sock',
  '/tmp/mysql.sock'].detect { |socket| File.exist?(socket) } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  variables:
    max_execution_time: <%= 5 * 60000 %> # 5 minutes
    sql_mode: 'NO_ENGINE_SUBSTITUTION'

<%# development/test normally keep one plain pool. With USE_DB_WORKER_REPLICAS
    they expand into the same primary + replica pair as the deployed
    environments, both pointing at the local database, so the routing can be
    exercised outside production — the flag used to abort boot here, which is
    why Procfile.dev cannot set it.

    Opt-in only, and not for the whole suite: Rails 7.2 pins just the
    writing-role pool for transactional fixtures
    (ActiveRecord::TestFixtures#setup_transactional_fixtures uses
    connection_pool_list(:writing)), so reads served by the reading pool cannot
    see uncommitted fixture rows. Assert on the role that served a statement,
    not on the rows it returned. %>
<% replicas_enabled = ENV["USE_DB_WORKER_REPLICAS"] == "true" %>
<% test_database = ENV.fetch("TEST_DATABASE_NAME", "gumroad_test") %>
<% if replicas_enabled %>
development:
  primary:
    <<: *default
    adapter: mysql2_proxy
  primary_replica:
    <<: *default
    replica: true

test:
  primary:
    <<: *default
    adapter: mysql2_proxy
    database: <%= test_database %>
  primary_replica:
    <<: *default
    replica: true
    database: <%= test_database %>
<% else %>
development:
  <<: *default

test:
  <<: *default
  database: <%= test_database %>
<% end %>

<%# Production Sidekiq/rpush/anycable set USE_DB_WORKER_REPLICAS=true (nomad).
    Makara used to SQL-route SELECTs to those replicas. Rails 7.2 cannot keep
    mysql2_makara, so the same flag now expands a native primary + replica pair
    and mysql2_proxy does the statement-level split. Web/Puma leave the flag
    unset and keep a single primary pool. Production has one worker replica;
    staging uses DATABASE_REPLICA2 instead.

    Fall back to the primary, as a whole group, when the environment has no
    replica secret: staging's Vault holds only secret/web/RDS, so these four
    would all be nil and the reading pool would attempt (and fail) a localhost
    connect on every read the proxy routes to it. Falling back per key instead
    of per group would pair a replica host with primary credentials. Same shape
    as database.branch-app.yml, which points the replica at the primary's host
    for the same reason. %>
<% replica_env = ->(prefix) { ENV["#{prefix}_HOST"].present? ? prefix : "DATABASE" } %>
<% if replicas_enabled %>
<% staging_replica = replica_env.call("DATABASE_REPLICA2") %>
<% production_replica = replica_env.call("DATABASE_WORKER_REPLICA1") %>
staging:
  primary:
    <<: *default
    adapter: mysql2_proxy
  primary_replica:
    <<: *default
    adapter: mysql2
    replica: true
    database: <%= ENV.fetch("#{staging_replica}_NAME") %>
    username: <%= ENV.fetch("#{staging_replica}_USERNAME") %>
    password: <%= ENV.fetch("#{staging_replica}_PASSWORD", "") %>
    host: <%= ENV.fetch("#{staging_replica}_HOST") %>

production:
  primary:
    <<: *default
    adapter: mysql2_proxy
  primary_replica:
    <<: *default
    adapter: mysql2
    replica: true
    database: <%= ENV.fetch("#{production_replica}_NAME") %>
    username: <%= ENV.fetch("#{production_replica}_USERNAME") %>
    password: <%= ENV.fetch("#{production_replica}_PASSWORD", "") %>
    host: <%= ENV.fetch("#{production_replica}_HOST") %>
<% else %>
staging: &staging
  <<: *default

production:
  <<: *staging
<% end %>
