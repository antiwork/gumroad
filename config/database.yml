development: &development
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  database: <%= ENV.fetch("DATABASE_NAME") %>
  host: <%= ENV.fetch("DATABASE_HOST") %>
  port: <%= ENV.fetch("DATABASE_PORT") %>
  # Keep the pool size above the Sidekiq concurrency so jobs don't run out of Active Record connections.
  # Sidekiq sets ENV["DB_POOL_SIZE"] to its concurrency. Web Puma does not, and
  # ActionController::Live plus publish-time AI threads checkout extra connections
  # beyond RAILS_MAX_THREADS (gp#2383). Production/staging never drop below 10,
  # even when RAILS_MAX_THREADS is set to Puma's thread count. Tests and
  # development keep the requested size, or 5.
  # See https://github.com/gumroad/infrastructure/issues/479 for more details.
  <% requested_pool = (ENV["DB_POOL_SIZE"].presence || ENV["RAILS_MAX_THREADS"].presence)&.to_i %>
  <% web_pool_floor = %w[production staging].include?(ENV.fetch("RAILS_ENV", "development")) ? 10 : nil %>
  pool: <%= web_pool_floor ? [requested_pool, web_pool_floor].compact.max : (requested_pool || 5) %>
  <%= "reconnect: true" unless ENV["SKIP_NATIVE_MYSQL_RECONNECT"] == "true" %>
  socket: <%= [
  '/var/run/mysqld/mysqld.sock',
  '/var/lib/mysql/mysql.sock',
  '/tmp/mysqld.sock',
  '/tmp/mysql.sock'].detect { |socket| File.exist?(socket) } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  variables:
    max_execution_time: <%= 5 * 60000 %> # 5 minutes
    sql_mode: 'NO_ENGINE_SUBSTITUTION'

test:
  <<: *development
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "gumroad_test") %>

<%# Production Sidekiq/rpush/anycable set USE_DB_WORKER_REPLICAS=true (nomad).
    Makara used to SQL-route SELECTs to those replicas. Rails 7.2 cannot keep
    mysql2_makara, so the same flag now expands a native primary + replica pair
    and mysql2_proxy does the statement-level split. Web/Puma leave the flag
    unset and keep a single primary pool. Proxy adapters support one replica;
    replica1 takes the AR reading role, replica2 stays in REPLICAS_HOSTS for lag
    watching. %>
<% if ENV["USE_DB_WORKER_REPLICAS"] == "true" %>
staging:
  primary:
    <<: *development
    adapter: mysql2_proxy
  primary_replica:
    <<: *development
    adapter: mysql2
    replica: true
    database: <%= ENV["DATABASE_REPLICA2_NAME"] %>
    username: <%= ENV["DATABASE_REPLICA2_USERNAME"] %>
    password: <%= ENV["DATABASE_REPLICA2_PASSWORD"] %>
    host: <%= ENV["DATABASE_REPLICA2_HOST"] %>

production:
  primary:
    <<: *development
    adapter: mysql2_proxy
  primary_replica:
    <<: *development
    adapter: mysql2
    replica: true
    database: <%= ENV["DATABASE_WORKER_REPLICA1_NAME"] %>
    username: <%= ENV["DATABASE_WORKER_REPLICA1_USERNAME"] %>
    password: <%= ENV["DATABASE_WORKER_REPLICA1_PASSWORD"] %>
    host: <%= ENV["DATABASE_WORKER_REPLICA1_HOST"] %>
<% else %>
staging: &staging
  <<: *development

production:
  <<: *staging
<% end %>
