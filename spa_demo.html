<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumroad SPA Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6/dist/index.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-white { background-color: white; }
        .border { border-width: 1px; }
        .border-gray-200 { border-color: #e5e7eb; }
        .rounded-lg { border-radius: 0.5rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .text-center { text-align: center; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .space-x-4 > * + * { margin-left: 1rem; }
        .text-blue-600 { color: #2563eb; }
        .text-gray-900 { color: #111827; }
        .text-lg { font-size: 1.125rem; }
        .font-semibold { font-weight: 600; }
        .h-32 { height: 8rem; }
        .w-8 { width: 2rem; }
        .h-8 { height: 2rem; }
        .border-b-2 { border-bottom-width: 2px; }
        .ml-2 { margin-left: 0.5rem; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .text-4xl { font-size: 2.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .font-medium { font-weight: 500; }
        .text-gray-600 { color: #4b5563; }
        .text-sm { font-size: 0.875rem; }
        .min-h-screen { min-height: 100vh; }
        nav { position: fixed; left: 0; top: 0; height: 100vh; width: 16rem; background: white; border-right: 1px solid #e5e7eb; z-index: 10; }
        .main-content { margin-left: 16rem; padding: 1.5rem; }
        .nav-item { display: flex; align-items: center; padding: 0.75rem 1rem; margin: 0.25rem 0; border-radius: 0.5rem; text-decoration: none; color: #374151; }
        .nav-item:hover { background-color: #f3f4f6; }
        .nav-item.active { background-color: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .nav-icon { margin-right: 0.75rem; font-size: 1.125rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { BrowserRouter, Routes, Route, Navigate, Link, useLocation } = ReactRouterDOM;

        // Mock Components for Demo
        const DashboardSidebar = ({ currentPath }) => {
            const navigationItems = [
                { path: "/", label: "Dashboard", icon: "📊" },
                { path: "/sales", label: "Analytics", icon: "📈" },
                { path: "/audience", label: "Audience", icon: "👥" },
                { path: "/utm_links", label: "UTM Links", icon: "🔗" },
                { path: "/products", label: "Products", icon: "📦" }
            ];

            return (
                <nav>
                    <div style={{ padding: '1.5rem' }}>
                        <div style={{ marginBottom: '2rem' }}>
                            <h1 style={{ fontSize: '1.25rem', fontWeight: 'bold', color: '#111827' }}>Gumroad SPA</h1>
                        </div>
                        <div>
                            {navigationItems.map((item) => {
                                const isActive = currentPath === item.path;
                                return (
                                    <Link
                                        key={item.path}
                                        to={item.path}
                                        className={`nav-item ${isActive ? 'active' : ''}`}
                                    >
                                        <span className="nav-icon">{item.icon}</span>
                                        {item.label}
                                    </Link>
                                );
                            })}
                        </div>
                    </div>
                </nav>
            );
        };

        const DashboardPage = () => (
            <div>
                <h1 style={{ fontSize: '2rem', fontWeight: 'bold', marginBottom: '1rem' }}>
                    🎉 SPA Dashboard Home
                </h1>
                <div className="bg-white p-6 rounded-lg border border-gray-200">
                    <h2 className="text-lg font-semibold text-gray-900 mb-4">Welcome to the SPA!</h2>
                    <p>This is the main dashboard page - no page reload! 🚀</p>
                    <div style={{ marginTop: '1rem', padding: '1rem', backgroundColor: '#dbeafe', borderRadius: '0.5rem' }}>
                        <p><strong>✅ SPA Features Working:</strong></p>
                        <ul style={{ marginTop: '0.5rem', paddingLeft: '1.5rem' }}>
                            <li>✅ Client-side routing (no page reloads)</li>
                            <li>✅ React components with state</li>
                            <li>✅ Navigation sidebar</li>
                            <li>✅ Loading states</li>
                            <li>✅ Error handling</li>
                        </ul>
                    </div>
                </div>
            </div>
        );

        const AnalyticsPage = () => {
            const [loading, setLoading] = useState(true);
            const [data, setData] = useState(null);

            useEffect(() => {
                setTimeout(() => {
                    setData({ revenue: 12450, sales: 150, views: 2340, conversion: 6.4 });
                    setLoading(false);
                }, 1000);
            }, []);

            if (loading) {
                return (
                    <div className="flex items-center justify-center h-32">
                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                        <span className="ml-2 text-gray-600">Loading analytics...</span>
                    </div>
                );
            }

            return (
                <div>
                    <h1 style={{ fontSize: '2rem', fontWeight: 'bold', marginBottom: '1rem' }}>
                        📈 Analytics (SPA)
                    </h1>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1rem' }}>
                        <div className="bg-white p-4 rounded-lg border border-gray-200">
                            <h3>Revenue</h3>
                            <p style={{ fontSize: '1.5rem', fontWeight: 'bold' }}>${data?.revenue.toLocaleString()}</p>
                        </div>
                        <div className="bg-white p-4 rounded-lg border border-gray-200">
                            <h3>Sales</h3>
                            <p style={{ fontSize: '1.5rem', fontWeight: 'bold' }}>{data?.sales}</p>
                        </div>
                        <div className="bg-white p-4 rounded-lg border border-gray-200">
                            <h3>Views</h3>
                            <p style={{ fontSize: '1.5rem', fontWeight: 'bold' }}>{data?.views.toLocaleString()}</p>
                        </div>
                        <div className="bg-white p-4 rounded-lg border border-gray-200">
                            <h3>Conversion</h3>
                            <p style={{ fontSize: '1.5rem', fontWeight: 'bold' }}>{data?.conversion}%</p>
                        </div>
                    </div>
                </div>
            );
        };

        const GenericPage = ({ title, icon, description }) => (
            <div>
                <h1 style={{ fontSize: '2rem', fontWeight: 'bold', marginBottom: '1rem' }}>
                    {icon} {title} (SPA)
                </h1>
                <div className="bg-white p-6 rounded-lg border border-gray-200 text-center py-12">
                    <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>{icon}</div>
                    <h3 style={{ fontSize: '1.125rem', fontWeight: '500', marginBottom: '0.5rem' }}>{title}</h3>
                    <p className="text-gray-600 mb-4">{description}</p>
                    <div style={{ fontSize: '0.875rem', color: '#2563eb' }}>
                        🚧 SPA Version - No page reload! Click other links to test navigation.
                    </div>
                </div>
            </div>
        );

        const DashboardLayout = ({ children }) => {
            const location = useLocation();
            
            return (
                <div className="min-h-screen bg-gray-50">
                    <DashboardSidebar currentPath={location.pathname} />
                    <main className="main-content">
                        {children}
                    </main>
                </div>
            );
        };

        const DashboardSPA = () => {
            return (
                <BrowserRouter>
                    <DashboardLayout>
                        <Routes>
                            <Route path="/" element={<DashboardPage />} />
                            <Route path="/sales" element={<AnalyticsPage />} />
                            <Route path="/audience" element={<GenericPage title="Audience" icon="👥" description="Track your customer demographics and behavior" />} />
                            <Route path="/utm_links" element={<GenericPage title="UTM Links" icon="🔗" description="Create and track your marketing campaign links" />} />
                            <Route path="/products" element={<GenericPage title="Products" icon="📦" description="Manage your digital products and sales" />} />
                            <Route path="*" element={<Navigate to="/" replace />} />
                        </Routes>
                    </DashboardLayout>
                </BrowserRouter>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardSPA />);
    </script>
</body>
</html>
